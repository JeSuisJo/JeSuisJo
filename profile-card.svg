<line x1="525" y1="15" x2="525" y2="475" stroke="#30363d" stroke-width="1"/>

<text x="545" y="35" font-size="13" fill="#c9d1d9">Fullstack developer in training, mostly building things because</text>
<text x="545" y="55" font-size="13" fill="#c9d1d9">doing them manually sounds like a waste of time. I'm lazy enough</text>
  <text x="545" y="75" font-size="13" fill="#c9d1d9">to spend three hours writing a script instead of doing something</text>
  <text x="545" y="95" font-size="13" fill="#c9d1d9">by hand for three minutes. Bots, automation and random tools tend</text>
  <text x="545" y="115" font-size="13" fill="#c9d1d9">to come out of that. Currently learning Japanese, building</text>
  <text x="545" y="135" font-size="13" fill="#c9d1d9">Nami along the way, and working mostly with TypeScript and</text>
  <text x="545" y="155" font-size="13" fill="#c9d1d9">Next.js. I make things, break things, then usually fix them.</text>


<line x1="535" y1="200" x2="1110" y2="200" stroke="#30363d" stroke-width="1"/>

<text x="545" y="228" font-size="13.5" fill="#c9d1d9">{</text>
<text x="545" y="248" font-size="13.5"><tspan fill="#7ee787">  &quot;name&quot;</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">&quot;Joris Podvin&quot;</tspan><tspan fill="#c9d1d9">,</tspan></text>
<text x="545" y="268" font-size="13.5"><tspan fill="#7ee787">  &quot;role&quot;</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">&quot;Fullstack Developer&quot;</tspan><tspan fill="#c9d1d9">,</tspan></text>
<text x="545" y="288" font-size="13.5"><tspan fill="#7ee787">  &quot;status&quot;</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">&quot;studying @ IPI Lyon&quot;</tspan><tspan fill="#c9d1d9">,</tspan></text>
<text x="545" y="308" font-size="13.5"><tspan fill="#7ee787">  &quot;stack&quot;</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">[&quot;TypeScript&quot;, &quot;Next.js&quot;, &quot;React&quot;, &quot;Python&quot;]</tspan><tspan fill="#c9d1d9">,</tspan></text>
<text x="545" y="328" font-size="13.5"><tspan fill="#7ee787">  &quot;learning&quot;</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">&quot;Japanese (JLPT N4)&quot;</tspan><tspan fill="#c9d1d9">,</tspan></text>
<text x="545" y="348" font-size="13.5"><tspan fill="#7ee787">  &quot;building&quot;</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">&quot;Nami&quot;</tspan><tspan fill="#c9d1d9">,</tspan><tspan fill="#8b949e">  # japanese learning app</tspan></text>
<text x="545" y="368" font-size="13.5"><tspan fill="#7ee787">  &quot;location&quot;</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">&quot;France, Lyon&quot;</tspan><tspan fill="#c9d1d9">,</tspan></text>
<text x="545" y="388" font-size="13.5"><tspan fill="#7ee787">  &quot;portfolio&quot;</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">&quot;joris-podvin.fr&quot;</tspan><tspan fill="#c9d1d9">,</tspan></text>
<text x="545" y="408" font-size="13.5"><tspan fill="#7ee787">  &quot;currently&quot;</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">&quot;shipping bugs, then fixing them&quot;</tspan><tspan fill="#c9d1d9">,</tspan></text>
